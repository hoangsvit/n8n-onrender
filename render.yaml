services:
  - type: web
    name: n8n
    runtime: docker
    region: oregon
    plan: free
    branch: main
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_LISTEN_ADDRESS
        value: 0.0.0.0
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_PUSH_BACKEND
        value: websocket
      - key: GENERIC_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: N8N_LOG_LEVEL
        value: warn
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: N8N_RUNNERS_ENABLED
        value: "false"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      - key: N8N_TEMPLATES_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_CONCURRENCY_PRODUCTION_LIMIT
        value: "1"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "24"
      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "100"
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: none
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none
      - key: EXECUTIONS_DATA_SAVE_ON_PROGRESS
        value: "false"
      - key: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
        value: "false"
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: filesystem
      - key: N8N_UNVERIFIED_PACKAGES_ENABLED
        value: "false"
