services:
  - type: web
    name: n8n
    env: docker
    region: frankfurt # Aligné sur votre base de données actuelle
    plan: free
    branch: main
    numInstances: 1
    healthCheckPath: /healthz
    initialDelaySeconds: 120 # Laisse 2 minutes à n8n pour démarrer sereinement
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: N8N_ENCRYPTION_KEY
        value: UneCleSuperSecuriseeAChanger123!
      - key: GENERIC_TIMEZONE
        value: Africa/Abidjan
      - key: TZ
        value: Africa/Abidjan
      - key: N8N_LOG_LEVEL
        value: warn # Réduit les logs pour économiser de la mémoire
      - key: NODE_OPTIONS
        value: --max-old-space-size=400 # Limite la RAM pour éviter le crash 137
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "24" # Réduit à 24h pour ne pas surcharger la base de données gratuite
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: all
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none
      - key: EXECUTIONS_DATA_SAVE_ON_PROGRESS
        value: "false"
      - key: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
        value: "false"

databases:
  - name: n8n-db
    plan: free
