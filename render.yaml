services:
  - type: web
    name: n8n
    runtime: docker
    region: oregon
    plan: standard
    branch: main
    numInstances: 1
    healthCheckPath: /healthz/readiness
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "2"
      - key: DB_POSTGRESDB_CONNECTION_TIMEOUT
        value: "30000"
      - key: DB_POSTGRESDB_DESTROY_TIMEOUT_MS
        value: "10000"
      - key: DB_STARTUP_CONNECT_MAX_RETRIES
        value: "10"
      - key: DB_PING_INTERVAL_SECONDS
        value: "10"
      - key: DB_PING_MAX_FAILURES_BEFORE_RECOVERY
        value: "5"
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_LISTEN_ADDRESS
        value: 0.0.0.0
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: GENERIC_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: N8N_LOG_LEVEL
        value: info
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      - key: N8N_CONCURRENCY_PRODUCTION_LIMIT
        value: "5"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "10000"
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: all
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none
      - key: EXECUTIONS_DATA_SAVE_ON_PROGRESS
        value: "false"
      - key: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
        value: "false"
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: filesystem
      - key: N8N_UNVERIFIED_PACKAGES_ENABLED
        value: "false"
      - key: N8N_RUNNERS_TASK_TIMEOUT
        value: "60"
      - key: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
        value: "268435456"
      - key: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
        value: "1000"
    disk:
      name: n8n-disk
      mountPath: /home/node/.n8n
      sizeGB: 5

databases:
  - name: n8n-db
    plan: basic-1gb
